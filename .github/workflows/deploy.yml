name: Deploy to GridPane

on:
  push:
    branches: [main]
    paths:
      - "wp-content/themes/marfas24/**"
      - "wp-content/plugins/faschingbauer-medical-schema/**"
  workflow_dispatch:

concurrency:
  group: deploy-gridpane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy theme + plugin via scp
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

          $SSH "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            rm -rf "${{ secrets.DEPLOY_PATH }}/themes/marfas24-new" "${{ secrets.DEPLOY_PATH }}/plugins/faschingbauer-medical-schema-new"
          '

          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -r \
            wp-content/themes/marfas24 \
            "$DEST/themes/marfas24-new"

          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -r \
            wp-content/plugins/faschingbauer-medical-schema \
            "$DEST/plugins/faschingbauer-medical-schema-new"

          $SSH "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            BASE="${{ secrets.DEPLOY_PATH }}"
            rm -rf "$BASE/themes/marfas24-old"
            mv "$BASE/themes/marfas24" "$BASE/themes/marfas24-old"
            mv "$BASE/themes/marfas24-new" "$BASE/themes/marfas24"

            rm -rf "$BASE/plugins/faschingbauer-medical-schema-old"
            mv "$BASE/plugins/faschingbauer-medical-schema" "$BASE/plugins/faschingbauer-medical-schema-old"
            mv "$BASE/plugins/faschingbauer-medical-schema-new" "$BASE/plugins/faschingbauer-medical-schema"

            rm -rf "$BASE/themes/marfas24-old" "$BASE/plugins/faschingbauer-medical-schema-old"
          '

      - name: Purge Redis page cache
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"

          cat > purge-cache.php <<'PHPEOF'
          <?php
          $r = new Redis();
          $r->connect('127.0.0.1', 6378);
          $r->auth(getenv('REDIS_PAGECACHE_PASS'));
          $r->select(7);
          $r->flushDB();
          echo 'Purged' . PHP_EOL;
          PHPEOF

          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            purge-cache.php \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/purge-cache-${{ github.run_id }}.php"

          $SSH "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            WPROOT="$(dirname "${{ secrets.DEPLOY_PATH }}")"
            REDIS_PAGECACHE_PASS="${{ secrets.REDIS_PAGECACHE_PASS }}" wp eval-file "/tmp/purge-cache-${{ github.run_id }}.php" --path="$WPROOT"
            rm -f "/tmp/purge-cache-${{ github.run_id }}.php"
          '
