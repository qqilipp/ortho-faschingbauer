name: Run WP-CLI command (diagnostics)

on:
  workflow_dispatch:
    inputs:
      wp_args:
        description: "Arguments after 'wp', e.g. post list --post_type=page --field=ID,post_title,post_name"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Write args file
        env:
          WP_ARGS: ${{ inputs.wp_args }}
        run: |
          printf '%s' "$WP_ARGS" > wp_args.txt

      - name: Upload args
        run: |
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            wp_args.txt \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/wp_args-${{ github.run_id }}.txt"

      - name: Run wp-cli
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          REMOTE_ARGS_FILE="/tmp/wp_args-${{ github.run_id }}.txt"

          $SSH "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            WPROOT="$(dirname "${{ secrets.DEPLOY_PATH }}")"
            ARGS="$(cat '"$REMOTE_ARGS_FILE"')"

            if ! command -v wp >/dev/null 2>&1; then
              echo "wp-cli not found on server"
              exit 1
            fi

            eval "wp $ARGS --path=\"$WPROOT\""

            rm -f '"$REMOTE_ARGS_FILE"'
          '
